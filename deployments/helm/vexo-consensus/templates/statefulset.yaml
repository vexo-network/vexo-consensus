{{- $root := . -}}
{{- $defaultValidator := dict "name" "validator-1" "configSecretName" .Values.configSecretName "keySecretName" .Values.keySecretName -}}
{{- $validators := .Values.validators | default (list $defaultValidator) -}}
{{- range $index, $validator := $validators }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "vexo-consensus.fullname" $root }}-{{ required "validator name is required" $validator.name }}
  labels:
    app.kubernetes.io/name: {{ include "vexo-consensus.name" $root }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: validator
    vexo.network/validator: {{ $validator.name | quote }}
spec:
  serviceName: {{ include "vexo-consensus.fullname" $root }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vexo-consensus.name" $root }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: validator
      vexo.network/validator: {{ $validator.name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "vexo-consensus.name" $root }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: validator
        vexo.network/validator: {{ $validator.name | quote }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics/text
        prometheus.io/port: "{{ $root.Values.service.rpcPort }}"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
{{ toYaml $root.Values.podSecurityContext | indent 8 }}
      nodeSelector:
{{ toYaml $root.Values.nodeSelector | indent 8 }}
      tolerations:
{{ toYaml $root.Values.tolerations | indent 8 }}
      affinity:
{{ toYaml $root.Values.affinity | indent 8 }}
      containers:
        - name: vexod
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          securityContext:
{{ toYaml $root.Values.securityContext | indent 12 }}
          args:
            - start
            - --home
            - /var/lib/vexo
          ports:
            - name: rpc
              containerPort: {{ $root.Values.service.rpcPort }}
            - name: p2p
              containerPort: {{ $root.Values.service.p2pPort }}
          env:
            - name: VEXO_CHAIN_ID
              value: {{ $root.Values.chainId | quote }}
            - name: VEXO_VALIDATOR_ID
              value: {{ $validator.name | quote }}
{{- with $root.Values.extraEnv }}
{{ toYaml . | indent 12 }}
{{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/vexo
{{- $configSecret := default $root.Values.configSecretName $validator.configSecretName }}
{{- if $configSecret }}
            - name: config
              mountPath: /var/lib/vexo/config.json
              subPath: config.json
              readOnly: true
            - name: config
              mountPath: /var/lib/vexo/module_config.json
              subPath: module_config.json
              readOnly: true
            - name: config
              mountPath: /var/lib/vexo/network_config.json
              subPath: network_config.json
              readOnly: true
            - name: config
              mountPath: /var/lib/vexo/consensus_config.json
              subPath: consensus_config.json
              readOnly: true
            - name: config
              mountPath: /var/lib/vexo/mempool_config.json
              subPath: mempool_config.json
              readOnly: true
            - name: config
              mountPath: /var/lib/vexo/log_config.json
              subPath: log_config.json
              readOnly: true
            - name: config
              mountPath: /var/lib/vexo/genesis.json
              subPath: genesis.json
              readOnly: true
{{- end }}
{{- $keySecret := default $root.Values.keySecretName $validator.keySecretName }}
{{- if $keySecret }}
            - name: keys
              mountPath: /var/lib/vexo/validator.key.json
              subPath: validator.key.json
              readOnly: true
            - name: keys
              mountPath: /var/lib/vexo/node.key.json
              subPath: node.key.json
              readOnly: true
{{- end }}
          readinessProbe:
            httpGet:
              path: /v1/diagnostics
              port: rpc
            periodSeconds: 5
            timeoutSeconds: 2
          startupProbe:
            httpGet:
              path: /v1/status
              port: rpc
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /v1/status
              port: rpc
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
{{ toYaml $root.Values.resources | indent 12 }}
      volumes:
{{- if $configSecret }}
        - name: config
          secret:
            secretName: {{ $configSecret }}
{{- end }}
{{- if $keySecret }}
        - name: keys
          secret:
            secretName: {{ $keySecret }}
{{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
{{- if $root.Values.storage.className }}
        storageClassName: {{ $root.Values.storage.className | quote }}
{{- end }}
        resources:
          requests:
            storage: {{ $root.Values.storage.size }}
{{- end }}
