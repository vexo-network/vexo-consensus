apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "vexo-consensus.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "vexo-consensus.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ include "vexo-consensus.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vexo-consensus.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "vexo-consensus.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics/text
        prometheus.io/port: "{{ .Values.service.rpcPort }}"
    spec:
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
      containers:
        - name: vexod
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
{{ toYaml .Values.securityContext | indent 12 }}
          args:
            - start
            - --home
            - /var/lib/vexo
          ports:
            - name: rpc
              containerPort: {{ .Values.service.rpcPort }}
            - name: p2p
              containerPort: {{ .Values.service.p2pPort }}
          env:
            - name: VEXO_CHAIN_ID
              value: {{ .Values.chainId | quote }}
{{- with .Values.extraEnv }}
{{ toYaml . | indent 12 }}
{{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/vexo
{{- if .Values.configSecretName }}
            - name: config
              mountPath: /var/lib/vexo/config.json
              subPath: config.json
              readOnly: true
            - name: config
              mountPath: /var/lib/vexo/module_config.json
              subPath: module_config.json
              readOnly: true
            - name: config
              mountPath: /var/lib/vexo/network_config.json
              subPath: network_config.json
              readOnly: true
            - name: config
              mountPath: /var/lib/vexo/consensus_config.json
              subPath: consensus_config.json
              readOnly: true
            - name: config
              mountPath: /var/lib/vexo/mempool_config.json
              subPath: mempool_config.json
              readOnly: true
            - name: config
              mountPath: /var/lib/vexo/log_config.json
              subPath: log_config.json
              readOnly: true
            - name: config
              mountPath: /var/lib/vexo/genesis.json
              subPath: genesis.json
              readOnly: true
{{- end }}
{{- if .Values.keySecretName }}
            - name: keys
              mountPath: /var/lib/vexo/validator.key.json
              subPath: validator.key.json
              readOnly: true
            - name: keys
              mountPath: /var/lib/vexo/node.key.json
              subPath: node.key.json
              readOnly: true
{{- end }}
          readinessProbe:
            httpGet:
              path: /v1/diagnostics
              port: rpc
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /v1/status
              port: rpc
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
{{- if .Values.configSecretName }}
        - name: config
          secret:
            secretName: {{ .Values.configSecretName }}
{{- end }}
{{- if .Values.keySecretName }}
        - name: keys
          secret:
            secretName: {{ .Values.keySecretName }}
{{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
{{- if .Values.storage.className }}
        storageClassName: {{ .Values.storage.className | quote }}
{{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
