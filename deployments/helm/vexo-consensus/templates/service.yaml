apiVersion: v1
kind: Service
metadata:
  name: {{ include "vexo-consensus.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "vexo-consensus.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: {{ include "vexo-consensus.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: rpc
      port: {{ .Values.service.rpcPort }}
      targetPort: rpc
    - name: p2p
      port: {{ .Values.service.p2pPort }}
      targetPort: p2p

