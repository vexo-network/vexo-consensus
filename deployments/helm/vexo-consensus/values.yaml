image:
  repository: ghcr.io/vexo-network/vexo-consensus
  tag: dev
  pullPolicy: IfNotPresent

chainId: vexo-chain

validators:
  - name: validator-1
    configSecretName: vexo-validator-1-config
    keySecretName: vexo-validator-1-keys
  - name: validator-2
    configSecretName: vexo-validator-2-config
    keySecretName: vexo-validator-2-keys
  - name: validator-3
    configSecretName: vexo-validator-3-config
    keySecretName: vexo-validator-3-keys
  - name: validator-4
    configSecretName: vexo-validator-4-config
    keySecretName: vexo-validator-4-keys

service:
  rpcPort: 26657
  p2pPort: 26656

storage:
  size: 20Gi
  className: ""

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

configSecretName: ""
keySecretName: ""

extraEnv: []
