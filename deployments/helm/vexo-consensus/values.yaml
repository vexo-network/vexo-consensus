image:
  repository: ghcr.io/vexo-network/vexo-consensus
  tag: dev
  pullPolicy: IfNotPresent

replicaCount: 4

chainId: vexo-chain

service:
  rpcPort: 26657
  p2pPort: 26656

storage:
  size: 20Gi
  className: ""

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

configSecretName: ""
keySecretName: ""

extraEnv: []

