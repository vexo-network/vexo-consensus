name: vexo-single-init

services:
  init:
    image: ${VEXO_IMAGE:-vexo-consensus:dev}
    environment:
      VEXO_KEY_PASSPHRASE: ${VEXO_KEY_PASSPHRASE:?set VEXO_KEY_PASSPHRASE}
    command:
      - network
      - init
      - --home
      - /var/lib/vexo/network
      - --chain-id
      - ${VEXO_CHAIN_ID:-vexo-chain}
      - --validators
      - ${VEXO_VALIDATORS:-4}
      - --network-config
      - /etc/vexo/topology.json
      - --web3-dev-accounts
      - --encrypt-keys
      - --overwrite
    volumes:
      - vexo-single-data:/var/lib/vexo
      - ./topology.single-host.json:/etc/vexo/topology.json:ro

volumes:
  vexo-single-data:
    name: ${VEXO_SINGLE_DATA_VOLUME:-vexo-single-data}
