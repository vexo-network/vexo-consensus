name: vexo-single-init

services:
  init:
    image: ${VEXO_IMAGE:-vexo-consensus:dev}
    command:
      - network
      - init
      - --home
      - /var/lib/vexo/network
      - --chain-id
      - ${VEXO_CHAIN_ID:-vexo-chain}
      - --validators
      - ${VEXO_VALIDATORS:-4}
      - --p2p-base-port
      - "26656"
      - --rpc-base-port
      - "26657"
      - --overwrite
    volumes:
      - vexo-single-data:/var/lib/vexo

volumes:
  vexo-single-data:
    name: vexo-single-data
