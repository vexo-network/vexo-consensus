name: vexo-single-init

services:
  init:
    image: ${VEXO_IMAGE:-vexo-consensus:dev}
    command:
      - network
      - init
      - --home
      - /var/lib/vexo/network
      - --chain-id
      - ${VEXO_CHAIN_ID:-vexo-chain}
      - --validators
      - ${VEXO_VALIDATORS:-4}
      - --network-config
      - /etc/vexo/topology.json
      - --overwrite
    volumes:
      - ./vexo-single-data:/var/lib/vexo
      - ./topology.single-host.json:/etc/vexo/topology.json:ro