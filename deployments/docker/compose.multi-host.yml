name: vexo-multi

services:
  validator:
    image: ${VEXO_IMAGE:-vexo-consensus:dev}
    restart: unless-stopped
    command:
      - start
      - --home
      - /var/lib/vexo/${VEXO_VALIDATOR_ID:?set VEXO_VALIDATOR_ID}
      - --run
      - --log-format
      - json
    volumes:
      - ${VEXO_VALIDATOR_HOME:?set VEXO_VALIDATOR_HOME}:/var/lib/vexo/${VEXO_VALIDATOR_ID}
    ports:
      - "${VEXO_RPC_PORT:-26657}:26657"
      - "${VEXO_P2P_PORT:-26656}:26656"
