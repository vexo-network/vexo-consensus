services:
  init:
    image: ${VEXO_IMAGE:-vexo-consensus:nocgo}
    build:
      context: ../..
      dockerfile: Dockerfile.nocgo
      args:
        GO_VERSION: ${VEXO_GO_VERSION:-1.26.5}
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
