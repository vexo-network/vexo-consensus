name: vexo-single

x-vexo-node: &vexo-node
  image: ${VEXO_IMAGE:-vexo-consensus:dev}
  restart: unless-stopped
  environment:
    VEXO_KEY_PASSPHRASE: ${VEXO_KEY_PASSPHRASE:?set VEXO_KEY_PASSPHRASE}
  volumes:
    - vexo-single-data:/var/lib/vexo
  networks:
    - vexo-single

services:
  validator-1:
    <<: *vexo-node
    command:
      - start
      - --home
      - /var/lib/vexo/network/validator-1
      - --run
    ports:
      - "${VEXO_RPC_PORT_1:-28657}:26657"
      - "${VEXO_P2P_PORT_1:-28656}:26656"

  validator-2:
    <<: *vexo-node
    command:
      - start
      - --home
      - /var/lib/vexo/network/validator-2
      - --run
    ports:
      - "${VEXO_RPC_PORT_2:-28667}:26657"
      - "${VEXO_P2P_PORT_2:-28666}:26656"

  validator-3:
    <<: *vexo-node
    command:
      - start
      - --home
      - /var/lib/vexo/network/validator-3
      - --run
    ports:
      - "${VEXO_RPC_PORT_3:-28677}:26657"
      - "${VEXO_P2P_PORT_3:-28676}:26656"

  validator-4:
    <<: *vexo-node
    command:
      - start
      - --home
      - /var/lib/vexo/network/validator-4
      - --run
    ports:
      - "${VEXO_RPC_PORT_4:-28687}:26657"
      - "${VEXO_P2P_PORT_4:-28686}:26656"

networks:
  vexo-single:

volumes:
  vexo-single-data:
    name: ${VEXO_SINGLE_DATA_VOLUME:-vexo-single-data}
    external: true
