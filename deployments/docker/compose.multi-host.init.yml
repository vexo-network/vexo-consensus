name: vexo-multi-init

services:
  init:
    image: ${VEXO_IMAGE:-vexo-consensus:dev}
    command:
      - network
      - init
      - --home
      - /var/lib/vexo/network
      - --chain-id
      - ${VEXO_CHAIN_ID:-vexo-chain}
      - --validators
      - ${VEXO_VALIDATORS:-4}
      - --network-config
      - /etc/vexo/topology.json
      - --overwrite
    volumes:
      - ${VEXO_NETWORK_DIR:-./.vexo-network}:/var/lib/vexo/network
      - ${VEXO_TOPOLOGY_CONFIG:-./topology.multi-host.json}:/etc/vexo/topology.json:ro
