global:
  resolve_timeout: 5m

route:
  receiver: operator-console
  group_by: ["alertname", "chain", "instance"]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 30m
  routes:
    - matchers:
        - severity="critical"
      receiver: critical-operator-console
      repeat_interval: 10m

receivers:
  - name: operator-console
    webhook_configs:
      - url: http://127.0.0.1:9099/vexo-alerts
        send_resolved: true

  - name: critical-operator-console
    webhook_configs:
      - url: http://127.0.0.1:9099/vexo-critical-alerts
        send_resolved: true

