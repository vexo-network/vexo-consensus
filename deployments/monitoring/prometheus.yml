global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/vexo-alerts.yml

scrape_configs:
  - job_name: vexo-validators
    metrics_path: /metrics/text
    static_configs:
      - targets:
          - validator-1:26657
          - validator-2:26657
          - validator-3:26657
          - validator-4:26657
        labels:
          chain: vexo-chain
          role: validator

