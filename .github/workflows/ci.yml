name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Vet
        run: make vet

      - name: Race
        run: make race

      - name: Docs
        run: make docs-check

      - name: Build
        run: make build

      - name: Network E2E
        run: make network-e2e

      - name: Release candidate smoke
        run: make release-candidate VERSION=ci
